# Fine-tune b1_dfd (epoch 15) để bắt NeuralTextures tốt hơn: cùng dữ liệu (data/clips_dfd, data/index_b),
# frame NeuralTextures được lấy gấp đôi trong nửa giả (dataset.balanced_sampler), lr nhỏ, 5 epoch.
# Lý do: b1_dfd bắt NeuralTextures c40 75,5% video (AUC so với thật 0,861), các kiểu khác ≥ 92%.
# Trên Kaggle: Add Input dataset chứa best.pt của b1_dfd; notebook tìm nó và truyền --init.
name: b1_nt
arch: swin_upernet
encoder: openmmlab/upernet-swin-tiny   # checkpoint ADE20K của Hugging Face
data_root: data/clips_dfd
index_dir: data/index_b
image_size: 224
batch_size: 16
epochs: 5
lr: 2.0e-5             # 1/5 của b1_dfd: chỉnh nhẹ, không làm mất cái đã học (OneCycleLR như cũ)
weight_decay: 0.05     # mức Swin gốc dùng
grad_clip: 1.0
bce_weight: 1.0        # L_seg = BCE + Dice
dice_weight: 1.0
threshold: 0.5         # ngưỡng pixel khi đánh giá
seed: 0
num_workers: 4
multitask: true        # thêm đầu nhị phân + đầu 5 lớp trên đặc trưng 1/32 của Swin
bin_weight: 0.5        # λ1
cls_weight: 0.5        # λ2
mix_c40: true          # thêm ảnh c40 của cùng các video
samples_per_epoch: 115123   # giữ số bước như B1 (cùng ngân sách tính toán), DFD ≈ 20% khung train
init: runs/b1_dfd/best.pt   # trọng số khởi tạo (train.py: optimizer, lịch lr bắt đầu mới)
method_weights:        # nửa giả: NeuralTextures gặp gấp đôi kiểu khác (16,5% so với 9,9% số mẫu)
  NeuralTextures: 2
select_by: cls         # best.pt = accuracy cân bằng thật/giả trên val (mục tiêu là phân loại)
