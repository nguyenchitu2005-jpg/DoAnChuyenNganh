# Phương án B: B1 (b1_mix.yaml) train lại từ đầu trên FF++ + phần DFD train, mọi thiết lập khác giữ nguyên.
# Dữ liệu: data/clips_dfd (FF++ = data/clips_ff: 4 đoạn × 8 khung cách đều, không lọc góc;
# DFD cắt lại 4 đoạn × 8 khung chính diện; khung cắt dịch vào trong ảnh nên gần như không dải đen),
# index data/index_b: train = FF++ train + DFD 14 diễn viên train (180 thật / 820 giả, đã bỏ khung xấu,
# nghiêng ≥ 30°); val, test = FF++ như cũ; dfd = DFD 14 diễn viên test (183 / 706), dfd_all = cả DFD.
# Video thật DFD tính là lớp Real ở đầu 5 lớp; video giả DFD không tính loss 5 lớp (train.py).
name: b1_dfd
arch: swin_upernet
encoder: openmmlab/upernet-swin-tiny   # checkpoint ADE20K của Hugging Face
data_root: data/clips_dfd
index_dir: data/index_b
image_size: 224
batch_size: 16
epochs: 30
lr: 1.0e-4             # OneCycleLR: warmup 5% số bước rồi giảm theo cosine
weight_decay: 0.05     # mức Swin gốc dùng
grad_clip: 1.0
bce_weight: 1.0        # L_seg = BCE + Dice
dice_weight: 1.0
threshold: 0.5         # ngưỡng pixel khi đánh giá
seed: 0
num_workers: 4
multitask: true        # thêm đầu nhị phân + đầu 5 lớp trên đặc trưng 1/32 của Swin
bin_weight: 0.5        # λ1
cls_weight: 0.5        # λ2
mix_c40: true          # thêm ảnh c40 của cùng các video
samples_per_epoch: 115123   # giữ số bước như B1 (cùng ngân sách tính toán), DFD ≈ 20% khung train
