# SegFormer-B0 (Hugging Face), encoder MiT-B0 pretrained ImageNet
name: segformer_b0
arch: segformer
encoder: nvidia/mit-b0
data_root: data/deepfakebench/FaceForensics++
index_dir: data/index
image_size: 256
batch_size: 16
epochs: 10
lr: 0.0001   # transformer cần learning rate nhỏ hơn CNN
weight_decay: 0.01
samples_per_epoch: null   # null = bằng số frame train (khoảng 115 nghìn)
bce_weight: 1.0
dice_weight: 1.0
threshold: 0.5
num_workers: 6
seed: 42
